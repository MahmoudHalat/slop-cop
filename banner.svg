<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="slop-cop — dual-axis AI-slop and readability auditor and rewriter for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#191220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b3a"/>
      <stop offset="0.5" stop-color="#ff3e9d"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="960" cy="70" r="300" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="80" y="146" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#ffffff" letter-spacing="-4">slop-cop</text>

  <!-- Two axes, stated as the two questions -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#efeaf4">
    <rect x="82" y="181" width="15" height="15" rx="3.5" fill="#ff5b3a"/>
    <text x="110" y="195">Does it sound like AI wrote it?</text>

    <rect x="82" y="219" width="15" height="15" rx="3.5" fill="#7c4dff"/>
    <text x="110" y="233">Can a real person still read it?</text>
  </g>

  <!-- Mode + reach -->
  <text x="84" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#a79fb3" letter-spacing="2">TWO AXES  ·  AUDIT + REWRITE  ·  CLAUDE CODE / CURSOR / CODEX</text>

  <!-- Accent underline -->
  <rect x="80" y="300" width="248" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Scan card: shows the two axes disagreeing (the reason two axes exist) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="735" y="86" width="390" height="168" rx="16" fill="#17111f" stroke="#342a41" stroke-width="1"/>
    <text x="765" y="120" font-size="11" fill="#6f6880" letter-spacing="3">SLOP-COP SCAN</text>

    <!-- AI-Slop row -->
    <text x="765" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e7e2ee">AI-Slop</text>
    <text x="1095" y="158" font-size="14" fill="#ff7a5c" text-anchor="end" letter-spacing="1">LOW</text>
    <rect x="765" y="169" width="330" height="8" rx="4" fill="#2a2233"/>
    <rect x="765" y="169" width="83" height="8" rx="4" fill="#ff5b3a"/>

    <!-- Comprehension row -->
    <text x="765" y="209" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e7e2ee">Comprehension</text>
    <text x="1095" y="209" font-size="14" fill="#b48cff" text-anchor="end" letter-spacing="1">HIGH</text>
    <rect x="765" y="220" width="330" height="8" rx="4" fill="#2a2233"/>
    <rect x="765" y="220" width="238" height="8" rx="4" fill="#7c4dff"/>
  </g>
</svg>
